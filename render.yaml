# Render Blueprint — https://render.com/docs/blueprint-spec
# After deploy, set SMTP_* and JWT_SECRET_KEY in the Render dashboard (Environment).
services:
  - type: web
    name: ai-medical-assistant
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn --app-dir backend app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DB_BACKEND
        value: sqlite
      - key: SQLITE_PATH
        value: /tmp/medical_assistant.db
      - key: USER_DATA_RETENTION_HOURS
        value: "24"
      - key: SHOW_OTP_IN_DEV
        value: "false"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true"
      # Set in Render dashboard (do not commit secrets):
      # RESEND_API_KEY (recommended — from resend.com API Keys)
      # RESEND_FROM=onboarding@resend.dev (optional)
      # SMTP_USER, SMTP_PASSWORD, SMTP_FROM (optional Gmail fallback)
      # OPENAI_API_KEY (optional)
